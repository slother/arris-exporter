name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes shouldn't rebuild/republish the edge image.
    paths-ignore:
      - "*.md"
      - "LICENSE"
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit

  # Dockerfile lint + Trivy fs scan (SARIF -> Security tab). Push-only: fork PRs
  # can't get security-events: write.
  docker-security:
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    uses: slother/.github/.github/workflows/docker-security.yml@main

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: slother/.github/.github/workflows/dependency-review.yml@main

  # Edge image on every green main push (tags: main, main-<sha>). Release-tagged
  # images (+ latest) come from release.yml. Empty release-tag = edge build.
  edge-publish:
    if: github.event_name == 'push'
    needs: [test]
    # Must grant the union of container-publish's job permissions; a narrower set
    # (e.g. contents: read) fails the run at startup, not just the gated step.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: slother/.github/.github/workflows/container-publish.yml@main
    with:
      release-tag: ""
